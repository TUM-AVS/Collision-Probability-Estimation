[project]
name = "analytic-collision-probabilities"
dynamic = ["version"]
description = "Library for estimating collision probabilities in dynamic environments."
license = "LGPL-3.0-or-later"
license-files = ["LICENSE"]


readme = "README.md"

dependencies = [
    "numpy >= 1.24.0, < 2.0.0",
    "scipy >= 1.10.1, < 2.0.0",
    "shapely >= 2.0.0, < 3.0.0",
    "matplotlib >= 3.7.0, < 4.0.0",
    "tabulate >= 0.9.0, < 1.0.0",
]
requires-python = ">=3.13"


[build-system]
requires = ["uv_build >= 0.8.17, <0.9.0"]
build-backend = "uv_build"
